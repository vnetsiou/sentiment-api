<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: #1e293b;
            border-radius: 1rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.25rem; color: #8bffe5; }
        p.subtitle { font-size: 0.875rem; color: #94a3b8; margin-bottom: 2rem; }
        textarea {
            width: 100%;
            height: 140px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            color: #e2e8f0;
            font-size: 1rem;
            padding: 1rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: #8bffe5; }
        button {
            margin-top: 1rem;
            width: 100%;
            padding: 0.875rem;
            background: #00bc91;
            color: #0f172a;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #8bffe5; }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        #result {
            margin-top: 1.5rem;
            padding: 1.25rem;
            border-radius: 0.75rem;
            display: none;
        }
        #result.positive { background: rgba(0,188,145,0.15); border: 1px solid #00bc91; }
        #result.negative { background: rgba(239,68,68,0.15); border: 1px solid #ef4444; }
        #result.neutral  { background: rgba(148,163,184,0.15); border: 1px solid #94a3b8; }
        .emoji { font-size: 2.5rem; }
        .label { font-size: 1.25rem; font-weight: 700; margin: 0.5rem 0 0.25rem; text-transform: capitalize; }
        .confidence { font-size: 0.875rem; color: #94a3b8; }
        .bar-wrap { margin-top: 0.75rem; background: #0f172a; border-radius: 9999px; height: 8px; overflow: hidden; }
        .bar { height: 100%; border-radius: 9999px; transition: width 0.6s ease; }
        .positive .bar { background: #00bc91; }
        .negative .bar { background: #ef4444; }
        .neutral .bar  { background: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sentiment Analysis</h1>
        <p class="subtitle">Type any text and find out if it's positive, negative, or neutral.</p>

        <textarea id="textInput" placeholder="E.g. This product is absolutely amazing!"></textarea>
        <button id="analyzeBtn" onclick="analyze()">Analyze</button>

        <div id="result">
            <div class="emoji" id="emoji"></div>
            <div class="label" id="label"></div>
            <div class="confidence" id="confidence"></div>
            <div class="bar-wrap"><div class="bar" id="bar"></div></div>
        </div>
    </div>

    <script>
        async function analyze() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) return;

            const btn = document.getElementById('analyzeBtn');
            btn.disabled = true;
            btn.textContent = 'Analyzing...';

            try {
                const res = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();

                const result = document.getElementById('result');
                const emojis = { positive: '😊', negative: '😤', neutral: '😐' };

                result.className = data.sentiment;
                result.style.display = 'block';
                document.getElementById('emoji').textContent = emojis[data.sentiment] ?? '🤔';
                document.getElementById('label').textContent = data.sentiment;
                document.getElementById('confidence').textContent = `Confidence: ${(data.confidence * 100).toFixed(1)}%`;
                document.getElementById('bar').style.width = `${data.confidence * 100}%`;
            } catch (e) {
                alert('Something went wrong. Is the server running?');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Analyze';
            }
        }

        document.getElementById('textInput').addEventListener('keydown', e => {
            if (e.key === 'Enter' && e.ctrlKey) analyze();
        });
    </script>
</body>
</html>
